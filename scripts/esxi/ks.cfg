# =============================================================================
#  Kickstart ESXi 8 - installation automatisée du lab imbriqué
#  Kickstart ESXi 8 - instalación automatizada del lab anidado
#
#  Gabarit à adapter : les valeurs réseau ci-dessous correspondent aux
#  variables de lab.env.example (ESXI_IP, ESXI_NETMASK, ESXI_GATEWAY,
#  ESXI_DNS, ESXI_HOSTNAME). Remplacer avant de graver l'ISO/le CD virtuel.
#  Plantilla a adaptar: los valores de red siguen las variables de
#  lab.env.example. Reemplazar antes de generar el ISO/CD virtual.
#
#  Usage : joindre ce fichier comme CD-ROM secondaire (ou via l'option de
#  boot ks=cdrom:/ks.cfg / ks=usb:/ks.cfg) au démarrage de l'installeur ESXi.
# =============================================================================

vmaccepteula

# Mot de passe root - À CHANGER avant utilisation / Contraseña root - CAMBIAR
rootpw --iscrypted $1$abcdefgh$V6DUj/gj2GC2Lv.Fpq3nY0

# Installation sur le premier disque détecté, datastore VMFS écrasé si présent
# Instalación en el primer disco detectado, datastore VMFS sobrescrito si existe
install --firstdisk --overwritevmfs --systemMediaSize=min

# Clavier et fuseau horaire / Teclado y huso horario
keyboard 'French'
timezone 'Europe/Paris'

# Réseau statique - adapter à lab.env / Red estática - adaptar a lab.env
network --bootproto=static --device=vmnic0 --ip=192.168.1.50 --netmask=255.255.255.0 --gateway=192.168.1.1 --nameserver=1.1.1.1 --hostname=esxi8-lab.lab.local --addvmportgroup=0

reboot

# =============================================================================
# %firstboot : exécuté une seule fois au premier démarrage, interpréteur busybox
# %firstboot: se ejecuta una sola vez en el primer arranque, intérprete busybox
# =============================================================================
%firstboot --interpreter=busybox

# Active et démarre SSH (TSM-SSH) pour la suite du provisioning
# Activa e inicia SSH (TSM-SSH) para continuar el aprovisionamiento
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# Active aussi le shell ESXi (TSM), utile pour le dépannage local
# También activa el shell de ESXi (TSM), útil para depuración local
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# La politique de sécurité du vSwitch et le portgroup LAB sont configurés
# par scripts/esxi/postinstall.sh (exécuté ensuite via SSH), pas ici.
# La política de seguridad del vSwitch y el portgroup LAB se configuran
# en scripts/esxi/postinstall.sh (ejecutado luego por SSH), no aquí.

esxcli network firewall ruleset set --ruleset-id=sshServer --enabled=true
