name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck-bash:
    name: ShellCheck (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck sur les scripts bash / ShellCheck en los scripts bash
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          ignore_paths: >-
            scripts/esxi/postinstall.sh
          severity: warning

  shellcheck-esxi-ash:
    name: ShellCheck (ash - ESXi postinstall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer ShellCheck / Instalar ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck en mode sh sur postinstall.sh (busybox ash ESXi)
        run: shellcheck -s sh scripts/esxi/postinstall.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyser les scripts PowerShell / Analizar los scripts PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $results = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            if ($results | Where-Object { $_.Severity -eq 'Error' }) {
              throw "PSScriptAnalyzer a trouvé des erreurs / PSScriptAnalyzer encontró errores."
            }
          } else {
            Write-Host "Aucun problème détecté / No se detectaron problemas."
          }

  markdown-link-check:
    name: Markdown link check (liens internes / enlaces internos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les liens internes des fichiers Markdown / Verificar enlaces internos de los Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --exclude-loopback
            '**/*.md'
          fail: true
